# Focusrite Thunderbolt naming (snd-clarett driver: Clarett + Red ranges).
#
# The Thunderbolt units have no pci.ids entry, so WirePlumber's default policy
# falls back to the ALSA *driver* string ("Clarett") for device.description —
# every unit then shows in GNOME as the generic "Clarett Multichannel", with no
# way to tell a 2Pre from a 4Pre (or one Red from another).
#
# The snd-clarett driver already names each card per model (ALSA card name
# "<range> <model>", PCM/node.nick likewise); this only promotes that model name
# into device.description, which is the field GNOME and most UIs actually
# display. Matching on the card name (which already carries the model)
# distinguishes multiple units plugged in at once.
#
# Install: copy to /usr/share/wireplumber/wireplumber.conf.d/ (or
# /etc/wireplumber/wireplumber.conf.d/), then `systemctl --user restart
# wireplumber` (or replug the interface).

monitor.alsa.rules = [
  {
    matches = [ { api.alsa.card.name = "Clarett 2Pre" } ]
    actions = { update-props = { device.description = "Clarett 2Pre" } }
  }
  {
    matches = [ { api.alsa.card.name = "Clarett 4Pre" } ]
    actions = { update-props = { device.description = "Clarett 4Pre" } }
  }
  {
    matches = [ { api.alsa.card.name = "Clarett 8Pre" } ]
    actions = { update-props = { device.description = "Clarett 8Pre" } }
  }
  {
    matches = [ { api.alsa.card.name = "Clarett 8PreX" } ]
    actions = { update-props = { device.description = "Clarett 8PreX" } }
  }
  {
    matches = [ { api.alsa.card.name = "Red 4Pre" } ]
    actions = { update-props = { device.description = "Red 4Pre" } }
  }
  {
    matches = [ { api.alsa.card.name = "Red 8Pre" } ]
    actions = { update-props = { device.description = "Red 8Pre" } }
  }
  {
    matches = [ { api.alsa.card.name = "Red 8Line" } ]
    actions = { update-props = { device.description = "Red 8Line" } }
  }
  {
    matches = [ { api.alsa.card.name = "Red 16Line" } ]
    actions = { update-props = { device.description = "Red 16Line" } }
  }
]
